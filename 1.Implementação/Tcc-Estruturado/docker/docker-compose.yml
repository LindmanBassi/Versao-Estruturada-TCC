name: tcc-estruturado

version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-estruturado
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcc_estruturado
      MYSQL_USER: tcc
      MYSQL_PASSWORD: tcc123456

    ports:
      - "3311:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: